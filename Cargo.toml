[workspace]
members = ["crates/rowboat-core", "crates/rowboat-services", "crates/rowboat", "crates/rowboat-tests", "crates/rowboat-admin", "crates/rowboat-cli"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rowboat-core = { path = "crates/rowboat-core" }
rowboat-services = { path = "crates/rowboat-services" }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 8
# Strip ordinary symbols as well as debug information from release executables.
strip = "symbols"
