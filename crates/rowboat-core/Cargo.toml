[package]
name = "rowboat-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
chrono.workspace = true
# SQLx 0.8's rustls verifier mishandles current rustls hostname error variants
# in verify-ca mode. Native TLS preserves CA-only vs full identity verification.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-native-tls", "postgres", "mysql", "sqlite", "chrono", "uuid", "json", "bigdecimal"] }
libsqlite3-sys = { version = "0.30.1", features = ["bundled"] }
# Intentional feature unification with SQLx: statically build OpenSSL on Linux
# instead of binding release archives to the build host's OpenSSL installation.
# On macOS native-tls continues to use Apple's system Security framework.
native-tls = { version = "0.2", features = ["vendored"] }
futures-util = "0.3"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
