[package]
name = "rowboat-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rowboatctl"
path = "src/main.rs"

[dependencies]
rowboat-core.workspace = true
rowboat-services.workspace = true
rowboat-admin = { path = "../rowboat-admin" }
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
