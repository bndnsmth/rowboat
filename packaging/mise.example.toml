# Replace OWNER with the GitHub repository owner. Publish the reviewed GitHub
# release first: mise intentionally does not list drafts.
[tools."github:OWNER/rowboat"]
version = "latest"
matching_regex = '^rowboat-.*-(x86_64|aarch64)-(unknown-linux-gnu|apple-darwin)\.tar\.gz$'
strip_components = 1
bin_path = "bin"
